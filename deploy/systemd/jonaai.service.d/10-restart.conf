# A systemd drop-in for jonaai.service. To install it:
#   install -m 644 deploy/systemd/jonaai.service.d/10-restart.conf \
#     /etc/systemd/system/jonaai.service.d/10-restart.conf
#   systemctl daemon-reload
# daemon-reload alone makes it live: systemd reads Restart= when the process exits, so the
# running backend needn't be restarted. Remove the file and run daemon-reload to undo it.
#
# Why: the unit has Restart=on-failure, which restarts an unclean exit code, a signal,
# a timeout, a watchdog expiry and an OOM kill, but not a clean exit (status 0). A backend
# that exits 0 without being asked would stay down. Restart=always also restarts that.
# `systemctl stop` still stops it: the restart rules never apply to a requested stop.
#
# Deliberately unchanged:
# - OOMPolicy=stop. Per systemd.service(5) for systemd 259 (this host), an OOM kill leaves
#   the unit in the oom-kill failed state "after which Restart= may apply", and the restart
#   table restarts "Termination due to OOM" under on-failure already.
# - The start limit. With RestartSec=15 the default limit (5 starts in 10 s) never trips,
#   so a backend that keeps failing keeps being retried every 15 s rather than giving up.
[Service]
Restart=always
